      <path d="M 356,204 L 370,200 M 370,200 Q 382,186 384,166 M 370,200 L 396,198 M 370,200 Q 382,216 382,236"/>
    </g>
  </g>
  <use xlink:href="#headShape" fill="url(#skin)"/>
  <g clip-path="url(#headClip)">
