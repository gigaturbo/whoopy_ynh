  <title>whoopy favicon</title>
  <!-- the mascot's head and gills, gills pulled in, strokes thickened for small sizes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#8e2f78" stroke-width="28">
      <path d="M 156,204 L 142,200 M 142,200 Q 130,186 128,166 M 142,200 L 116,198 M 142,200 Q 130,216 130,236"/>
      <path d="M 356,204 L 370,200 M 370,200 Q 382,186 384,166 M 370,200 L 396,198 M 370,200 Q 382,216 382,236"/>
