    <linearGradient id="shade" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="296">
      <stop offset="0" stop-color="#0f6f86" stop-opacity="0"/>
      <stop offset="1" stop-color="#0f6f86" stop-opacity="0.28"/>
    </linearGradient>
    <!-- the mascot's head, closed under the chin -->
    <path id="headShape" d="M 256,132 C 326,132 368,162 368,206 C 368,262 320,294 256,294
