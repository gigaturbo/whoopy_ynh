# LiteLLM proxy configuration, rendered by the Yunohost scripts (jinja).
# Holds no secret: keys and the database URL come from the root-600 whoopy.env.
# Models and MCP servers added in the admin page live in the database, not here:
# any other MCP server on this machine is added there, never in this file.

model_list:
  # Every model Ollama has, as ollama/<name>. The wake hook sets the status
  # page's keep_alive on these two routes.
  - model_name: "ollama/*"
    litellm_params:
      model: "ollama_chat/*"
      api_base: "{{ ollama_url }}"
  # The same machine's embedding models, as ollama-embed/<name>: the wildcard
  # above goes through Ollama's chat API, which LiteLLM cannot embed with.
  # Same address, so the wake hook wakes the machine for these too.
  - model_name: "ollama-embed/*"
    litellm_params:
      model: "ollama/*"
      api_base: "{{ ollama_url }}"
    model_info:
      mode: "embedding"

{%- if whoopy_mcp != "off" %}
mcp_servers:
  # Wake, status and model list of the AI server, from whoopy-wake on
  # loopback, at /mcp/whoopy. Who may use it is the panel's choice: every key
  # by default, since a chat request wakes the machine anyway.
  whoopy:
    url: "http://127.0.0.1:{{ port_mcp }}/mcp"
    transport: "http"
    description: "Wake the AI server, see its state and its models"
    auth_type: "bearer_token"
    authentication_token: os.environ/WHOOPY_MCP_TOKEN
    allow_all_keys: {{ "true" if whoopy_mcp == "all" else "false" }}
    # LiteLLM gives an MCP call 60 s by default; a wake may take up to the
    # page's longest timeout, 540 s.
    timeout: 550
{%- endif %}

litellm_settings:
  # Beside this file. whoopy_prisma pins the database engine's port, and must
  # load before LiteLLM starts that engine.
  callbacks: ["whoopy_prisma.pin", "whoopy_wake.handler"]
  drop_params: true
  # /v1/models asks Ollama's /api/tags for the wildcard above. That loads no
  # model; while the machine sleeps it fails fast and lists nothing.
  check_provider_endpoint: true

router_settings:
  # A retry would wait out a second wake on a machine that did not come up.
  num_retries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
{%- if env_login == "0" %}
  # Only personal admin accounts (database users) may sign in to the admin page.
  disable_env_credential_login: true
{%- endif %}
  # A health check sends a real completion: it would load a model and keep
  # the AI server awake. Leave off.
  background_health_checks: false
  # Behind nginx every client is 127.0.0.1; the login throttle needs the real one.
  trusted_proxy_ranges: ["127.0.0.1/32", "::1/128"]
