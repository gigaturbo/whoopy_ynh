# /mcp/<name> exactly: from the LAN ranges, or from anywhere for a server the
# status page opened, which the wake daemon answers (F-M-15). A key granted
# that server is still required; if the daemon is down, only the LAN gets in.
# First, so it wins over the LAN-only location below. The raw path is checked
# too: nginx matches the decoded, normalised path, LiteLLM gets it decoded but
# not normalised, so "/mcp/docs%2F..%2Fweb" must not pass as /mcp/web.
# "/mcp/web,docs" or "/mcp/web/x" would pick other servers.
location ~ ^/mcp/([A-Za-z0-9_-]+)/?$ {
    # Before the check below, which would reset $1.
    set $whoopy_mcp $1;
    if ($request_uri !~ "^/mcp/[A-Za-z0-9_-]+/?(?:\?|$)") {
        return 403;
    }
    satisfy any;
    __LAN_ALLOW__
    deny all;
    auth_request /whoopy-mcp-public;
    # Replaces SSOwat's server-wide check here: it passes /mcp, public, and
    # under satisfy any its pass would let every caller in.
    access_by_lua_block { return ngx.exit(ngx.HTTP_FORBIDDEN) }

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # MCP uses server-sent events; a wake can take minutes.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    # The same limit as from the LAN, so a large write tool call behaves alike.
    client_max_body_size 64m;
}

location = /whoopy-mcp-public {
    internal;
    proxy_pass http://127.0.0.1:__PORT_WEB__/whoopy/mcp-public/check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Whoopy-Mcp $whoopy_mcp;
}

# The MCP routes, LiteLLM's and its admin page's: the local networks only
# (the panel's LAN ranges), a 403 for the rest of the internet. The tools stay
# behind a token as well; the LLM API below stays open to any token.
location ~ ^/(([^/]+/)?mcp(-rest)?|toolset/[^/]+/mcp|public/mcp_hub|api/v1/inspect/mcp)(/|$) {
    __LAN_ALLOW__
    deny all;

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Answers stream token by token; MCP uses server-sent events.
    proxy_buffering off;
    proxy_request_buffering off;

    # Nothing is sent until the Ollama machine has woken, loaded the model
    # and read the prompt: a long context alone can pass 600 s.
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    # Images sent to vision models.
    client_max_body_size 64m;
}

location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Answers stream token by token; MCP uses server-sent events.
    proxy_buffering off;
    proxy_request_buffering off;

    # Nothing is sent until the Ollama machine has woken, loaded the model
    # and read the prompt: a long context alone can pass 600 s.
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    # Images sent to vision models.
    client_max_body_size 64m;
}

# The status page and its two calls, served by the wake daemon. A wake waits
# for the machine to answer, up to the wake timeout (540 s at most).
location = / {
    proxy_pass http://127.0.0.1:__PORT_WEB__;
    proxy_set_header Host $host;
}
location /whoopy/ {
    proxy_pass http://127.0.0.1:__PORT_WEB__;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
}

# Browser icons, from the package rather than LiteLLM's.
location = /favicon.ico {
    alias __INSTALL_DIR__/icons/favicon.ico;
}
location = /favicon.svg {
    alias __INSTALL_DIR__/icons/favicon.svg;
}
location = /apple-touch-icon.png {
    alias __INSTALL_DIR__/icons/favicon-180.png;
}
# The status page's header mascot and its title font.
location = /mascot.svg {
    alias __INSTALL_DIR__/icons/mascot.svg;
}
location = /fredoka.woff2 {
    alias __INSTALL_DIR__/icons/fredoka.woff2;
}
