# The MCP servers the panel opens to the internet, at /mcp/<name> exactly; a
# key granted that server is still required. First, so it wins over the
# LAN-only location below. The raw path is checked too: nginx matches the
# decoded, normalised path, LiteLLM gets it decoded but not normalised, so
# "/mcp/docs%2F..%2Fweb" must not pass as /mcp/web. "/mcp/web,docs" or
# "/mcp/web/x" would pick other servers.
location ~ ^/mcp/(__MCP_PUBLIC_RE__)/?$ {
    if ($request_uri !~ "^/mcp/(__MCP_PUBLIC_RE__)/?(\?|$)") {
        return 403;
    }

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # MCP uses server-sent events; a wake can take minutes.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    # The same limit as from the LAN, so a large write tool call behaves alike.
    client_max_body_size 64m;
}

# The MCP routes, LiteLLM's and its admin page's: the local networks only
# (the panel's LAN ranges), a 403 for the rest of the internet. The tools stay
# behind a token as well; the LLM API below stays open to any token.
location ~ ^/(([^/]+/)?mcp(-rest)?|toolset/[^/]+/mcp|public/mcp_hub|api/v1/inspect/mcp)(/|$) {
    __LAN_ALLOW__
    deny all;

    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Answers stream token by token; MCP uses server-sent events.
    proxy_buffering off;
    proxy_request_buffering off;

    # Nothing is sent until the Ollama machine has woken, loaded the model
    # and read the prompt: a long context alone can pass 600 s.
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    # Images sent to vision models.
    client_max_body_size 64m;
}

location / {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Answers stream token by token; MCP uses server-sent events.
    proxy_buffering off;
    proxy_request_buffering off;

    # Nothing is sent until the Ollama machine has woken, loaded the model
    # and read the prompt: a long context alone can pass 600 s.
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    # Images sent to vision models.
    client_max_body_size 64m;
}

# The status page and its two calls, served by the wake daemon. A wake waits
# for the machine to answer, up to the wake timeout (540 s at most).
location = / {
    proxy_pass http://127.0.0.1:__PORT_WEB__;
    proxy_set_header Host $host;
}
location /whoopy/ {
    proxy_pass http://127.0.0.1:__PORT_WEB__;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
}

# Browser icons, from the package rather than LiteLLM's.
location = /favicon.ico {
    alias __INSTALL_DIR__/icons/favicon.ico;
}
location = /favicon.svg {
    alias __INSTALL_DIR__/icons/favicon.svg;
}
location = /apple-touch-icon.png {
    alias __INSTALL_DIR__/icons/favicon-180.png;
}
