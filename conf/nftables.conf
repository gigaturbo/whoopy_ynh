# Whoopy's user, which runs LiteLLM and the wake daemon, may reach on
# loopback only DNS, PostgreSQL, the daemon's MCP server and the panel's
# loopback_ports: not LDAP, Redis, the YunoHost API or any other app (B-P-6).
# Answers to clients of its own ports are established connections. Rendered
# by whoopy_firewall, never backed up: the uid may differ after a restore.
table inet __APP__
delete table inet __APP__
table inet __APP__ {
    chain output {
        type filter hook output priority filter; policy accept;
        oifname "lo" meta skuid __UID__ jump app_loopback
    }
    chain app_loopback {
        ct state established,related accept
        ip daddr 127.0.0.1 meta l4proto { tcp, udp } th dport 53 accept
        ip daddr 127.0.0.1 tcp dport { __PORTS__ } accept
        meta l4proto tcp counter reject with tcp reset
        counter reject
    }
}
