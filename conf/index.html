<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whoopy</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Served by the wake daemon (whoopy serve), behind the portal's admin
     permission. Its calls: GET /whoopy/status, POST /whoopy/wake, and
     GET and POST /whoopy/settings; the daemon requires the header X-Whoopy: 1
     on each POST.
     The MCP servers section calls LiteLLM's /v1/mcp/server straight from the
     browser, with the key inside LiteLLM's sign-in cookie `token` (a JWT,
     its `key` claim) as Bearer, as its dashboard does: the daemon never sees
     a key or a server's token. -->
<style>
  :root {
    --ink: #05323d; --muted: #4d6f78; --line: #d6ecf1; --bg: #f3fbfd; --card: #fff;
    --teal: #1a9ab2; --teal-deep: #0f6f86; --pink: #c955a8;
    --up: #1f9d6b; --wait: #d08a12; --down: #8a9aa0; --bad: #c2413a;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e4f6fa; --muted: #93b4bc; --line: #1d3a42; --bg: #0b1d22; --card: #112a31;
            --teal: #4cc4db; --teal-deep: #6fdcef; --down: #6c7f85; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  nav { display: flex; align-items: center; gap: .25rem; padding: 0 1rem;
        background: var(--card); border-bottom: 1px solid var(--line); }
  nav .brand { display: flex; align-items: center; gap: .5rem; font-weight: 700;
               margin-right: 1rem; color: var(--ink); text-decoration: none; }
  nav .brand img { width: 28px; height: 28px; }
  nav a.tab { padding: .9rem .9rem; color: var(--muted); text-decoration: none;
              border-bottom: 3px solid transparent; }
  nav a.tab:hover { color: var(--ink); }
  nav a.tab[aria-current] { color: var(--ink); border-bottom-color: var(--teal); }
  main { max-width: 34rem; margin: 2.5rem auto; padding: 0 1rem; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 1.5rem; }
  .state { display: flex; align-items: center; gap: .75rem; font-size: 1.35rem; font-weight: 600; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--down); flex: none; }
  .dot.up { background: var(--up); box-shadow: 0 0 0 4px color-mix(in srgb, var(--up) 20%, transparent); }
  .dot.waking { background: var(--wait); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: .5rem 1rem; margin: 1.25rem 0; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  button { font: inherit; font-weight: 600; padding: .65rem 1.4rem; border-radius: 8px; border: 0;
           background: var(--teal-deep); color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: var(--bg); } }
  button:disabled { opacity: .5; cursor: default; }
  #message { margin: .75rem 0 0; min-height: 1.5em; color: var(--muted); }
  #message.bad, #mcp-message.bad { color: var(--bad); }
  .card + .card { margin-top: 1.5rem; }
  h2 { font-size: 1.1rem; margin: 0 0 1rem; }
  #mcp-list { list-style: none; padding: 0; margin: 0 0 1.25rem; }
  #mcp-list li { display: flex; align-items: center; gap: .75rem; padding: .6rem 0;
                 border-bottom: 1px solid var(--line); }
  #mcp-list .what { flex: 1; min-width: 0; }
  #mcp-list .url, .hint { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
  #mcp-list button { padding: .35rem .8rem; background: var(--bad); }
  form { display: grid; gap: .75rem; }
  form[hidden] { display: none; }
  label { display: grid; gap: .25rem; color: var(--muted); }
  label.check { display: flex; align-items: center; gap: .5rem; }
  input[type=text], input[type=url], input[type=password], input[type=number] {
    font: inherit; padding: .5rem .6rem; border-radius: 6px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); }
  form button { justify-self: start; }
  #mcp-message, #set-message { margin: .75rem 0 0; min-height: 1.5em; color: var(--muted); }
  #set-message.bad { color: var(--bad); }
  a { color: var(--teal-deep); }
</style>
</head>
<body>
<nav>
  <a class="brand" href="/"><img src="/favicon.svg" alt="">Whoopy</a>
  <a class="tab" href="/" aria-current="page">Status</a>
  <a class="tab" href="/ui/">Admin</a>
  <a class="tab" href="/docs">API docs</a>
</nav>
<main>
  <section class="card" aria-live="polite">
    <div class="state"><span id="dot" class="dot"></span><span id="state">Checking…</span></div>
    <dl>
      <dt>Requests</dt><dd id="enabled">…</dd>
      <dt>Last wake</dt><dd id="last">…</dd>
    </dl>
    <button id="wake" type="button">Wake</button>
    <p id="message"></p>
  </section>
  <section class="card" id="settings">
    <h2>Wake settings</h2>
    <form id="set-form" hidden>
      <label class="check"><input type="checkbox" name="wol_enabled">
        Wake the Ollama machine when a request needs it</label>
      <label>MAC address of its network card, the one with Wake-on-LAN on
        <input type="text" name="wol_mac" placeholder="aa:bb:cc:dd:ee:ff" autocomplete="off"
               pattern="([0-9a-fA-F]{2}[:\-]){5}[0-9a-fA-F]{2}"></label>
      <label>Broadcast address for the wake packet
        <input type="text" name="wol_broadcast" required placeholder="255.255.255.255"></label>
      <label>Seconds to wait for Ollama after a wake, 10 to 540
        <input type="number" name="wake_timeout_s" required min="10" max="540"></label>
      <label>How long a model stays loaded after a request, e.g. 5m; empty: Ollama's own
        <input type="text" name="keep_alive" pattern="[0-9]+[smh]" autocomplete="off"></label>
      <button type="submit">Save</button>
    </form>
    <p id="set-message"></p>
  </section>
  <section class="card" id="mcp">
    <h2>MCP servers</h2>
    <ul id="mcp-list"></ul>
    <form id="mcp-add" hidden>
      <label>Name, served at /mcp/&lt;name&gt;
        <input type="text" name="name" required pattern="[a-z0-9_]{1,32}"
               title="Lower-case letters, digits and _" autocomplete="off"></label>
      <label>Address
        <input type="url" name="url" required placeholder="http://127.0.0.1:8770/mcp"></label>
      <label>Bearer token, empty if it asks for none
        <input type="password" name="token" autocomplete="off"></label>
      <label class="check"><input type="checkbox" name="all" checked> Every key may use it</label>
      <button type="submit">Add</button>
    </form>
    <p class="hint">Grants per key and tool filters are in the
      <a href="/ui/">admin page</a> (MCP Servers, Virtual Keys).</p>
    <p id="mcp-message"></p>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let wakeRunning = false;
// True while the message is one refresh() set, so only refresh() clears it.
let statusMessage = false;

function ago(unix) {
  const s = Math.max(0, Math.round(Date.now() / 1000 - unix));
  if (s < 90) return `${s} s ago`;
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  if (s < 129600) return `${Math.round(s / 3600)} h ago`;
  return new Date(unix * 1000).toLocaleString();
}

function show(st) {
  const state = st.up ? "up" : st.waking ? "waking" : "down";
  $("dot").className = `dot ${state}`;
  $("state").textContent = {
    up: "The Ollama machine is awake",
    waking: "The Ollama machine is waking up",
    down: "The Ollama machine is asleep",
  }[state];
  $("enabled").textContent = st.enabled
    ? "wake it when they need a local model"
    : "never wake it (Wake-on-LAN is off)";
  const l = st.last;
  $("last").textContent = !l ? "none since the service started"
    : l.ok ? `answered after ${l.seconds} s, ${ago(l.started)}`
    : `failed ${ago(l.started)}: ${l.reason}`;
  $("wake").disabled = wakeRunning || st.up || st.waking;
}

async function refresh() {
  try {
    const r = await fetch("/whoopy/status", { cache: "no-store", redirect: "manual" });
    if (r.type === "opaqueredirect") {
      $("dot").className = "dot";
      $("state").textContent = "Your portal session has expired";
      say("Reload the page to log in again.", true, true);
      return;
    }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    show(await r.json());
    if (statusMessage) say("");
  } catch (e) {
    $("dot").className = "dot";
    $("state").textContent = "The wake service does not answer";
    say(String(e.message || e), true, true);
  }
}

function say(text, bad = false, fromStatus = false) {
  statusMessage = fromStatus;
  $("message").textContent = text;
  $("message").className = bad ? "bad" : "";
}

$("wake").addEventListener("click", async () => {
  wakeRunning = true;
  $("wake").disabled = true;
  say("Waking it up. This can take a minute or two.");
  refresh();
  try {
    const r = await fetch("/whoopy/wake",
      { method: "POST", headers: { "X-Whoopy": "1" }, redirect: "manual" });
    if (r.type === "opaqueredirect") throw new Error("your portal session has expired, reload the page");
    const out = await r.json().catch(() => ({ reason: `HTTP ${r.status}` }));
    wakeRunning = false;
    if (out.ok) say(`Awake after ${out.seconds} s.`);
    else say(`The wake failed: ${out.reason}`, true);
  } catch (e) {
    wakeRunning = false;
    say(`The wake failed: ${e.message || e}`, true);
  }
  refresh();
});

// MCP servers, through LiteLLM with the key its sign-in cookie carries: the
// cookie is a JWT, refused as a Bearer, whose `key` claim is the session's key.
function litellmToken() {
  const c = document.cookie.split("; ").find((c) => c.startsWith("token="));
  if (!c) return "";
  try {
    const claims = decodeURIComponent(c.slice(6)).split(".")[1];
    return JSON.parse(atob(claims.replace(/-/g, "+").replace(/_/g, "/"))).key || "";
  } catch { return ""; }
}

function mcpSay(text, bad = false) {
  $("mcp-message").textContent = text;
  $("mcp-message").className = bad ? "bad" : "";
}

// Resolves to the JSON answer, or throws a sentence for the user.
async function litellm(method, path, body) {
  const token = litellmToken();
  if (!token) throw new Error("Sign in to the admin page first (Admin tab), then reload.");
  const r = await fetch(path, {
    method, redirect: "manual", cache: "no-store",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: body && JSON.stringify(body),
  });
  if (r.type === "opaqueredirect") throw new Error("Your portal session has expired, reload the page.");
  if (r.status === 401) throw new Error("Your admin page session has expired: sign in again (Admin tab), then reload.");
  const out = await r.json().catch(() => null);
  if (r.status === 403 && !out) throw new Error("MCP servers are managed from the local networks only.");
  if (!r.ok) {
    const d = out && out.detail;
    throw new Error(`LiteLLM answered ${r.status}: ${typeof d === "string" ? d : JSON.stringify(d || out)}`);
  }
  return out;
}

async function listMcp() {
  let servers;
  try {
    servers = await litellm("GET", "/v1/mcp/server");
  } catch (e) {
    $("mcp-list").replaceChildren();
    $("mcp-add").hidden = true;
    mcpSay(e.message, true);
    return;
  }
  $("mcp-add").hidden = false;
  $("mcp-list").replaceChildren(...servers.map((s) => {
    const li = document.createElement("li");
    const what = document.createElement("div");
    what.className = "what";
    const name = document.createElement("strong");
    name.textContent = `/mcp/${s.alias || s.server_name}`;
    const url = document.createElement("div");
    url.className = "url";
    url.textContent = `${s.url || s.command || ""} · ${s.allow_all_keys ? "every key" : "granted keys"}`
      + (s.is_config ? " · from the package" : "");
    what.append(name, url);
    li.append(what);
    if (!s.is_config) {
      const rm = document.createElement("button");
      rm.type = "button";
      rm.textContent = "Remove";
      rm.addEventListener("click", async () => {
        if (!confirm(`Remove /mcp/${s.server_name}? Keys granted it lose the grant.`)) return;
        try {
          await litellm("DELETE", `/v1/mcp/server/${encodeURIComponent(s.server_id)}`);
          mcpSay(`Removed ${s.server_name}.`);
        } catch (e) { mcpSay(e.message, true); }
        listMcp();
      });
      li.append(rm);
    }
    return li;
  }));
}

$("mcp-add").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target.elements;
  const body = {
    server_name: f.name.value, url: f.url.value, transport: "http",
    allow_all_keys: f.all.checked,
  };
  if (f.token.value) {
    body.auth_type = "bearer_token";
    body.credentials = { auth_value: f.token.value };
  }
  try {
    await litellm("POST", "/v1/mcp/server", body);
    ev.target.reset();
    mcpSay(`Added: /mcp/${body.server_name}.`);
  } catch (e) { mcpSay(e.message, true); }
  listMcp();
});

// Wake settings, kept by the wake daemon and applied at once.
function setSay(text, bad = false) {
  $("set-message").textContent = text;
  $("set-message").className = bad ? "bad" : "";
}

async function loadSettings() {
  try {
    const r = await fetch("/whoopy/settings", { cache: "no-store", redirect: "manual" });
    if (r.type === "opaqueredirect") throw new Error("Your portal session has expired, reload the page.");
    if (!r.ok) throw new Error(`The wake service answered ${r.status}.`);
    const st = await r.json();
    const f = $("set-form").elements;
    f.wol_enabled.checked = st.wol_enabled;
    for (const k of ["wol_mac", "wol_broadcast", "wake_timeout_s", "keep_alive"]) f[k].value = st[k];
    $("set-form").hidden = false;
  } catch (e) { setSay(e.message || String(e), true); }
}

$("set-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target.elements;
  const body = {
    wol_enabled: f.wol_enabled.checked, wol_mac: f.wol_mac.value.trim(),
    wol_broadcast: f.wol_broadcast.value.trim(), wake_timeout_s: Number(f.wake_timeout_s.value),
    keep_alive: f.keep_alive.value.trim(),
  };
  try {
    const r = await fetch("/whoopy/settings", {
      method: "POST", redirect: "manual",
      headers: { "X-Whoopy": "1", "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (r.type === "opaqueredirect") throw new Error("Your portal session has expired, reload the page.");
    if (!r.ok) throw new Error(await r.text() || `The wake service answered ${r.status}.`);
    setSay("Saved. The next wake uses them.");
    refresh();
  } catch (e) { setSay(e.message || String(e), true); }
});

loadSettings();
listMcp();
refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
