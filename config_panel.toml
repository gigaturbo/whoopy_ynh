version = "1.0"

[main]
name = "Whoopy"

    [main.ollama]
    name = "Ollama"
    help = "The wake settings and how long a model stays loaded are on Whoopy's status page, at /."

        [main.ollama.ollama_url]
        ask = "Ollama URL"
        type = "string"
        help = "Scheme, host and port, without a path. With outbound access set to local networks, it must be a private address."
        pattern.regexp = '^https?://[^/]+$'
        pattern.error = "scheme, host and port only, e.g. http://192.168.1.10:11434"
        bind = "settings"

    [main.access]
    name = "Access"

        [main.access.outbound]
        ask = "Where LiteLLM may connect"
        type = "select"
        choices.lan = "Local networks only (recommended)"
        choices.any = "Anywhere (needed for cloud providers)"
        help = "Local networks only means a compromised release cannot send anything to the internet. Cloud models (OpenAI, Anthropic...) need Anywhere."
        bind = "settings"

        [main.access.lan_ranges]
        ask = "Networks that may reach the MCP tools"
        type = "string"
        help = "Addresses or networks separated by spaces. Requests to /mcp and the other MCP routes from anywhere else get a 403. Add this server's public IPv6 prefix so home devices using it are let in; the LLM API stays open to any token."
        bind = "settings"

        [main.access.mcp_public]
        ask = "MCP servers reachable from the internet"
        type = "string"
        optional = true
        help = "Server names separated by spaces, e.g. web docs. Each is reached at /mcp/<name> from anywhere, with a key granted that server. Every other server, the bare /mcp and the management routes stay on the LAN ranges. Empty keeps them all local."
        bind = "settings"

        [main.access.ui_password]
        ask = "New admin password for LiteLLM's page"
        type = "password"
        optional = true
        help = "User: admin. Leave empty to keep the current one."
        bind = "null"

        [main.access.env_login]
        ask = "Allow the shared admin login (user admin, password above)"
        type = "boolean"
        help = "LiteLLM advises turning it off once you have your own admin account, made in its admin page (Users, role Admin, with a password). Turning it off is refused until such an account exists. Turn it back on here if you are locked out."
        bind = "settings"

    [main.master_key]
    name = "Master key"

        [main.master_key.new_master_key]
        ask = "Replace the master key"
        type = "button"
        style = "warning"
        help = "Scripts using the old master key stop working. Tokens made in the admin page keep working."
