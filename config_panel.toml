version = "1.0"

[main]
name = "Whoopy"

    [main.ollama]
    name = "Ollama"

        [main.ollama.ollama_url]
        ask = "Ollama URL"
        type = "string"
        help = "Scheme, host and port, without a path. With outbound access set to local networks, it must be a private address."
        pattern.regexp = '^https?://[^/]+$'
        pattern.error = "scheme, host and port only, e.g. http://192.168.1.10:11434"
        bind = "settings"

        [main.ollama.keep_alive]
        ask = "How long a model stays loaded"
        type = "string"
        optional = true
        help = "After a request through Whoopy, e.g. 5m or 30s. Shorter lets the Ollama machine sleep sooner. Empty: Ollama's own setting."
        pattern.regexp = '^$|^[0-9]+[smh]$'
        pattern.error = "A number followed by s, m or h, e.g. 5m"
        bind = "settings"

    [main.wol]
    name = "Wake-on-LAN"
    help = "Wakes the Ollama machine when a request arrives and it does not answer. The request waits until Ollama answers, or fails after the timeout."

        [main.wol.wol_enabled]
        ask = "Wake the Ollama machine on demand"
        type = "boolean"
        bind = "settings"

        [main.wol.wol_mac]
        ask = "MAC address of its network card"
        type = "string"
        optional = true
        example = "aa:bb:cc:dd:ee:ff"
        help = "The card with Wake-on-LAN enabled. On that machine: ip link"
        pattern.regexp = '^$|^([0-9a-fA-F]{2}[:-]){5}[0-9a-fA-F]{2}$'
        pattern.error = "Six pairs of hex digits, e.g. aa:bb:cc:dd:ee:ff"
        bind = "settings"

        [main.wol.wol_broadcast]
        ask = "Broadcast address for the wake packet"
        type = "string"
        help = "255.255.255.255 reaches the local network this server is on. Use the subnet's own broadcast (e.g. 192.168.1.255) if the server has several networks."
        pattern.regexp = '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
        pattern.error = "An IPv4 address"
        bind = "settings"

        [main.wol.wake_timeout_s]
        ask = "Seconds to wait for Ollama after a wake"
        type = "number"
        min = 10
        max = 540
        help = "Past this, the request fails with a 503. nginx waits at most 1200 s for the whole request."
        bind = "settings"

    # A button sits alone in its section: Save skips any section holding one.
    [main.wake]
    name = "Wake now"

        [main.wake.wake_status]
        type = "markdown"
        ask = "The wake daemon's state."

        [main.wake.wake_now]
        ask = "Wake it now"
        type = "button"
        help = "Sends the wake packet and waits for Ollama to answer, using the saved MAC, broadcast and timeout."

    [main.search]
    name = "Web search"
    help = "Tools that search the web and read a public page, served by the cheruby-search-mcp app. Clients reach them at /mcp/web with any Whoopy token."

        [main.search.search_enabled]
        ask = "Offer web search through /mcp/web"
        type = "boolean"
        bind = "settings"

        [main.search.search_url]
        ask = "Address of its MCP server"
        type = "string"
        help = "The default is that app's own, on this server."
        pattern.regexp = '^https?://[^/"\s]+(/[^"\s]*)?$'
        pattern.error = "A URL, e.g. http://127.0.0.1:8770/mcp"
        bind = "settings"

        [main.search.search_token]
        ask = "New token"
        type = "password"
        optional = true
        help = "The one cheruby-search-mcp gives: sudo cheruby-search-mcp token. Leave empty to keep the current one."
        bind = "null"

    [main.docs]
    name = "Documents"
    help = "Folders served by the cheruby-docs-mcp app, the ones it opens to the token below, read-only but for those it marks writable. Clients reach them at /mcp/docs, with a Whoopy key granted the docs server in LiteLLM's admin page. Its embedding model, EmbeddingGemma, is offered too, as embeddinggemma, to any key."

        [main.docs.docs_enabled]
        ask = "Offer documents through /mcp/docs"
        type = "boolean"
        bind = "settings"

        [main.docs.docs_url]
        ask = "Address of its MCP server"
        type = "string"
        help = "The default is that app's own, on this server."
        pattern.regexp = '^https?://[^/"\s]+(/[^"\s]*)?$'
        pattern.error = "A URL, e.g. http://127.0.0.1:8770/mcp"
        bind = "settings"

        [main.docs.docs_embed_url]
        ask = "Address of its embedding model"
        type = "string"
        optional = true
        help = "The default is that app's own, on this server. Empty: no embeddinggemma."
        pattern.regexp = '^$|^https?://[^/"\s]+(/[^"\s]*)?$'
        pattern.error = "A URL, e.g. http://127.0.0.1:8771/v1"
        bind = "settings"

        [main.docs.docs_token]
        ask = "New token"
        type = "password"
        optional = true
        help = "The one cheruby-docs-mcp gives for the folders it opens to Whoopy: sudo cheruby-docs-mcp token. Leave empty to keep the current one."
        bind = "null"

    [main.access]
    name = "Access"

        [main.access.outbound]
        ask = "Where LiteLLM may connect"
        type = "select"
        choices.lan = "Local networks only (recommended)"
        choices.any = "Anywhere (needed for cloud providers)"
        help = "Local networks only means a compromised release cannot send anything to the internet. Cloud models (OpenAI, Anthropic...) need Anywhere."
        bind = "settings"

        [main.access.lan_ranges]
        ask = "Networks that may reach the MCP tools"
        type = "string"
        help = "Addresses or networks separated by spaces. Requests to /mcp and the other MCP routes from anywhere else get a 403. Add this server's public IPv6 prefix so home devices using it are let in; the LLM API stays open to any token."
        bind = "settings"

        [main.access.ui_password]
        ask = "New admin password for LiteLLM's page"
        type = "password"
        optional = true
        help = "User: admin. Leave empty to keep the current one."
        bind = "null"

        [main.access.env_login]
        ask = "Allow the shared admin login (user admin, password above)"
        type = "boolean"
        help = "LiteLLM advises turning it off once you have your own admin account, made in its admin page (Users, role Admin, with a password). Turning it off is refused until such an account exists. Turn it back on here if you are locked out."
        bind = "settings"

    [main.master_key]
    name = "Master key"

        [main.master_key.new_master_key]
        ask = "Replace the master key"
        type = "button"
        style = "warning"
        help = "Scripts using the old master key stop working. Tokens made in the admin page keep working."
